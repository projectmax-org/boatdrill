name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The restic, rclone and 7z adapters are tested against the real tools; without them those tests are skipped.
      - name: Install restic, rclone and 7-Zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic rclone 7zip

      # The engine has no Windows dependency, so the quickest check runs here.
      - name: Test
        run: dotnet test tests/Boatdrill.Core.Tests -c Release --nologo

      - name: Compile everything, the Windows app included
        run: dotnet build Boatdrill.slnx -c Release --nologo

  windows:
    name: App on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The restic, rclone and 7z tests again, on Windows paths (restic's snapshots name them /C/Users/...).
      # Should an install fail, those tests are skipped rather than failing the build.
      - name: Install restic, rclone and 7-Zip
        shell: pwsh
        continue-on-error: true
        run: choco install restic rclone 7zip --no-progress -y

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Tests again on Windows, publishes the single-file executables, and builds the installer from them,
      # so a change that breaks installer\Boatdrill.iss fails here rather than on release day.
      - name: Test, publish and build the installer
        shell: pwsh
        run: .\build.ps1 -Installer

      # Loads every view against sample data and renders it to PNG in both themes. Fails on a XAML or
      # resource error, or on a binding to a property that does not exist. The images are kept below.
      - name: Capture the views
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifacts\screens'
          $app = Start-Process -FilePath 'dist\Boatdrill.exe' -ArgumentList '--capture', $out -PassThru
          $null = $app.Handle
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw 'The view capture did not finish within three minutes.' }
          Get-ChildItem $out | Format-Table Name, Length -AutoSize
          if ($app.ExitCode -ne 0) {
            Get-Content (Join-Path $out 'capture-error.txt') -ErrorAction SilentlyContinue
            Select-String -Path (Join-Path $out 'binding-messages.txt') -Pattern 'path error' -ErrorAction SilentlyContinue
            throw "The view capture failed with exit code $($app.ExitCode)."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: boatdrill-${{ github.sha }}
          path: |
            dist/Boatdrill.exe
            dist/boatdrill-cli.exe
            artifacts/installer/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boatdrill-screens-${{ github.sha }}
          path: artifacts/screens
          if-no-files-found: warn
