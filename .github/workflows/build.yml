name: Build

# On main, on a branch a release is being prepared on (release-prep, release-1.1), and on every pull request.
on:
  push:
    branches: [main, 'release-*']
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core tests on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The restic, rclone and 7z adapters are tested against the real tools; without them those tests are skipped.
      - name: Install restic, rclone and 7-Zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic rclone 7zip

      # And the Kopia adapter against the real kopia: a pinned release, checked against its published SHA-256.
      - name: Install kopia
        env:
          KOPIA_VERSION: 0.23.1
          KOPIA_SHA256: 416d0f84a3dbb321a8b2d8f0997b1a0a6e915babe79ee76fa6e4d2bd1e1c5178
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kopia.tar.gz" "https://github.com/kopia/kopia/releases/download/v$KOPIA_VERSION/kopia-$KOPIA_VERSION-linux-x64.tar.gz"
          echo "$KOPIA_SHA256  $RUNNER_TEMP/kopia.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kopia.tar.gz" -C "$RUNNER_TEMP"
          echo "BOATDRILL_KOPIA=$RUNNER_TEMP/kopia-$KOPIA_VERSION-linux-x64/kopia" >> "$GITHUB_ENV"

      # The engine has no Windows dependency, so the quickest check runs here.
      - name: Test
        run: dotnet test tests/Boatdrill.Core.Tests -c Release --nologo

      - name: Compile everything, the Windows app included
        run: dotnet build Boatdrill.slnx -c Release --nologo

  windows:
    name: App on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The restic, rclone, 7z and Kopia tests again, on Windows paths (restic's snapshots name them /C/Users/...).
      # Should an install fail, those tests are skipped rather than failing the build.
      - name: Install restic, rclone and 7-Zip
        shell: pwsh
        continue-on-error: true
        run: choco install restic rclone 7zip --no-progress -y

      - name: Install kopia
        shell: pwsh
        env:
          KOPIA_VERSION: 0.23.1
          KOPIA_SHA256: f0369d9657dbe47a1b8b6ff4e308c5958a4813b405d4e32ae9d81b3f2b3d8251
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'kopia.zip'
          Invoke-WebRequest "https://github.com/kopia/kopia/releases/download/v$env:KOPIA_VERSION/kopia-$env:KOPIA_VERSION-windows-x64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:KOPIA_SHA256) { throw 'The kopia download does not match its published SHA-256.' }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "BOATDRILL_KOPIA=$env:RUNNER_TEMP\kopia-$env:KOPIA_VERSION-windows-x64\kopia.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Tests again on Windows, publishes the single-file executables, and builds the installer from them,
      # so a change that breaks installer\Boatdrill.iss fails here rather than on release day.
      - name: Test, publish and build the installer
        shell: pwsh
        run: .\build.ps1 -Installer

      # The installer just built installs and uninstalls cleanly here, as the release workflow checks again
      # on the one it is about to offer.
      - name: Install and uninstall it once
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer -Filter 'Boatdrill-Setup-*.exe' | Select-Object -First 1
          .\installer\Test-Installer.ps1 -Setup $setup.FullName -LogDirectory "$env:RUNNER_TEMP/installer-test"

      # Loads every view against sample data and renders it to PNG in both themes, in English and in Korean.
      # Fails on a XAML or resource error, or on a binding to a property that does not exist. The images are
      # kept below. This is the first place the single-file Boatdrill.exe starts, so a crash is reported too.
      - name: Capture the views
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifacts\screens'
          $started = Get-Date
          $app = Start-Process -FilePath 'dist\Boatdrill.exe' -ArgumentList '--capture', $out -PassThru
          $null = $app.Handle
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw 'The view capture did not finish within three minutes.' }
          Write-Host ('The capture took {0:N0} s and exited with {1}.' -f ((Get-Date) - $started).TotalSeconds, $app.ExitCode)
          # Missing if the app stopped before it began; Get-ChildItem would stop the step before the exit code is read.
          if (Test-Path $out) { Get-ChildItem $out -Recurse -File | ForEach-Object { '{0,10:N0}  {1}' -f $_.Length, $_.FullName.Substring($out.Length + 1) } }
          if ($app.ExitCode -ne 0) {
            Get-Content (Join-Path $out 'capture-error.txt') -ErrorAction SilentlyContinue
            Select-String -Path (Join-Path $out 'binding-messages.txt') -Pattern 'path error' -ErrorAction SilentlyContinue
            # A crash outside the capture's own try/catch (App.xaml, a dispatcher callback) leaves its exception only in the Application log.
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = '.NET Runtime', 'Application Error'; StartTime = $started } -ErrorAction SilentlyContinue |
              Select-Object -First 4 | Format-List TimeCreated, ProviderName, Message
            throw "The view capture failed with exit code $($app.ExitCode)."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: boatdrill-${{ github.sha }}
          path: |
            dist/Boatdrill.exe
            dist/boatdrill-cli.exe
            artifacts/installer/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boatdrill-screens-${{ github.sha }}
          path: artifacts/screens
          if-no-files-found: warn
