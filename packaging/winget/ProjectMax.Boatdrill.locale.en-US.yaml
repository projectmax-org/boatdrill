ShortDescription: Rehearses restoring from your backups and says, in plain words, whether they would work.
Description: |-
  Boatdrill checks that your backups would really bring your files back. On a schedule it restores a
  random sample of files from each backup into a scratch folder and compares every byte with the
  original, then says in plain words whether the backup would restore, how far behind it is, and how
  long a full restore would take. It reads folders of copies on drives and NAS shares, Windows File
  History, restic repositories, rclone remotes, and zip and 7z archives, and never writes to a backup.
