PackageIdentifier: ProjectMax.Boatdrill
PackageVersion: {{Version}}
PackageLocale: ko-KR
Publisher: Project Max
PackageName: Boatdrill
License: MIT
ShortDescription: 백업에서 실제로 복원해 보고, 그 백업이 제대로 작동할지 쉬운 말로 알려 줍니다.
Description: |-
  Boatdrill은 백업이 정말로 파일을 되살려 줄 수 있는지 확인합니다. 정해진 일정에 따라 백업마다
  파일을 무작위로 골라 임시 폴더에 복원하고 원본과 한 바이트도 빠짐없이 비교한 다음, 그 백업으로
  복원이 될지, 얼마나 뒤처져 있는지, 전체를 복원하는 데 얼마나 걸릴지를 쉬운 말로 알려 줍니다.
  드라이브와 NAS 공유 폴더의 사본 폴더, Windows 파일 히스토리, restic 저장소, rclone 원격 저장소,
  zip과 7z 압축 파일을 읽을 수 있으며, 백업에는 아무것도 쓰지 않습니다.
Tags:
- 백업
- 복원
- 검증
